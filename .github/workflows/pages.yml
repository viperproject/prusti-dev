name: Build GitHub pages

on:
  workflow_dispatch:
  push:
    branches: 'main'
  pull_request:
    branches: 'main'

env:
  RUST_BACKTRACE: 1
  # Currently broken. See issue #1287
  # RUSTDOCFLAGS: "--generate-link-to-definition -Zunstable-options"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: "repo"
          submodules: recursive

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v1.5.1
        with:
          fail: true
          # Check all Markdown and HTML files (the action's default inputs), except in the
          # `pcg` submodule, a separate project with its own (generated) pages. The option
          # must come last, since it takes all values that follow it.
          args: --verbose --no-progress './**/*.md' './**/*.html' --exclude-path repo/pcg

      - name: Prepare output directory
        run: |
          mkdir -p output
          cp -r repo/docs/static/* output/

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v1
        with:
          # mdBook 0.5 rejects the books' configuration (e.g. `multilingual`)
          mdbook-version: "0.4.52"

      - name: Build dummy crate to get dependencies
        run: |
          cd repo/docs/dummy/
          cargo build --target-dir ./target
          # Cargo keeps each crate's artifacts in a separate directory
          echo "DOCTEST_DEPS=$(ls -d $PWD/target/debug/build/*/*/out | paste -sd, -)" >> $GITHUB_ENV
          # mdbook runs rustdoc outside of the repository, where `rust-toolchain` does not apply
          echo "DOCTEST_TOOLCHAIN=$(rustup show active-toolchain | cut -d' ' -f1)" >> $GITHUB_ENV

      - name: Build user guide
        run: |
          cd repo/docs/user-guide
          mdbook build -d ../../../output/user-guide

      - name: Build dev guide
        run: |
          cd repo/docs/dev-guide
          mdbook build -d ../../../output/dev-guide

      - name: Doctest user guide
        run: |
          cd repo/docs/user-guide
          RUSTUP_TOOLCHAIN=$DOCTEST_TOOLCHAIN mdbook test -L "$DOCTEST_DEPS"

      - name: Doctest dev guide
        run: |
          cd repo/docs/dev-guide
          RUSTUP_TOOLCHAIN=$DOCTEST_TOOLCHAIN mdbook test -L "$DOCTEST_DEPS"

      - name: Set up the environment
        run: |
          cd repo
          python x.py setup

      - name: Generate documentation
        run: |
          cd repo
          python x.py doc --all --no-deps
          cp -r ./target/doc ../output/doc

      # Only deploy on push to main
      - name: Publish to GitHub pages
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          force_orphan: true
