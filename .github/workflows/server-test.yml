name: Windows-Server-Test

on:
  push:
    branches: [main]
    paths-ignore: 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore: 'docs/**'

env:
  RUST_BACKTRACE: 1
  PRUSTI_ASSERT_TIMEOUT: 60000

jobs:
  # Build and test in release mode
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            label: windows-latest-x64
          - os: windows-11-arm
            label: windows-latest-arm64
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '23'

      - name: Set up the environment
        run: python x.py setup

      - name: Build with cargo --release
        run: python x.py build --release --all

      - name: Run cargo tests --release
        run: python x.py test --release --all

      - name: Package Prusti artifact
        run: python x.py package release prusti_artifact

      - name: Test Prusti artifact
        run: python x.py test-package prusti_artifact