[package]
name = "prusti-encoder"
version = "0.1.0"
authors = ["Prusti Devs <prusti_developers@sympa.ethz.ch>"]
edition = "2024"

[lib]
doctest = false # we have no doc tests

[dependencies]
cfg-if = "1.0.0"
prusti-rustc-interface = { path = "../prusti-rustc-interface" }
prusti-interface = { path = "../prusti-interface" }
prusti-utils = { path = "../prusti-utils" }
# mir-ssa-analysis = { path = "../mir-ssa-analysis" }
pcg = { path = "../pcg" }
task-encoder = { path = "../task-encoder" }
vir = { path = "../vir" }
tracing = { path = "../tracing" }

backtrace-on-stack-overflow = { git = "https://github.com/Pistonight/backtrace-on-stack-overflow", branch = "feature/limit_stack_size" }

[package.metadata.rust-analyzer]
# This crate uses #[feature(rustc_private)]
rustc_private = true

[features]
# default = ["mono_function_encoding"]
vir_debug = ["vir/vir_debug"]
mono_function_encoding = []
